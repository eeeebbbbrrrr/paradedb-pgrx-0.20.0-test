[package]
name = "pg_search"
description = "One Postgres for your application data, full-text search, vector retrieval, and aggregations"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg15 = [
  "pgrx/pg15",
  "pgrx-tests/pg15",
  "common/pg15",
  "storage/pg15",
  "index_read/pg15",
  "index_write/pg15",
  "scan/pg15",
  "planner/pg15",
  "basescan/pg15",
  "joinscan/pg15",
]
pg16 = [
  "pgrx/pg16",
  "pgrx-tests/pg16",
  "common/pg16",
  "storage/pg16",
  "index_read/pg16",
  "index_write/pg16",
  "scan/pg16",
  "planner/pg16",
  "basescan/pg16",
  "joinscan/pg16",
]
pg17 = [
  "pgrx/pg17",
  "pgrx-tests/pg17",
  "common/pg17",
  "storage/pg17",
  "index_read/pg17",
  "index_write/pg17",
  "scan/pg17",
  "planner/pg17",
  "basescan/pg17",
  "joinscan/pg17",
]
pg18 = [
  "pgrx/pg18",
  "pgrx-tests/pg18",
  "common/pg18",
  "storage/pg18",
  "index_read/pg18",
  "index_write/pg18",
  "scan/pg18",
  "planner/pg18",
  "basescan/pg18",
  "joinscan/pg18",
]
pg_test = [
  "dep:proptest",
  "common/pg_test",
  "storage/pg_test",
  "index_read/pg_test",
  "index_write/pg_test",
  "scan/pg_test",
  "planner/pg_test",
  "basescan/pg_test",
  "joinscan/pg_test",
]
# direct dep so the coverage shim survives into the cdylib (see lib.rs)
dst = [
  "dst/enabled",
  "dep:antithesis-instrumentation",
  "common/dst",
  "storage/dst",
  "index_read/dst",
  "index_write/dst",
  "scan/dst",
  "planner/dst",
  "basescan/dst",
  "joinscan/dst",
]
unsafe-postgres = [
  "pgrx/unsafe-postgres",
  "common/unsafe-postgres",
  "storage/unsafe-postgres",
  "index_read/unsafe-postgres",
  "index_write/unsafe-postgres",
  "scan/unsafe-postgres",
  "planner/unsafe-postgres",
  "basescan/unsafe-postgres",
  "joinscan/unsafe-postgres",
]
block_tracker = [
  "common/block_tracker",
  "storage/block_tracker",
  "index_read/block_tracker",
  "index_write/block_tracker",
  "scan/block_tracker",
  "planner/block_tracker",
  "basescan/block_tracker",
  "joinscan/block_tracker",
] # for debugging when blocks are acquired and released
debug-logging = [
  "dep:env_logger",
  "common/debug-logging",
  "storage/debug-logging",
  "index_read/debug-logging",
  "index_write/debug-logging",
  "scan/debug-logging",
  "planner/debug-logging",
  "basescan/debug-logging",
  "joinscan/debug-logging",
] # enables env_logger for dependency debug output

[dependencies]
common = { path = "../common", default-features = false }
storage = { path = "../storage", default-features = false }
index_read = { path = "../index_read", default-features = false }
index_write = { path = "../index_write", default-features = false }
scan = { path = "../scan", default-features = false }
planner = { path = "../planner", default-features = false }
basescan = { path = "../basescan", default-features = false }
joinscan = { path = "../joinscan", default-features = false }
async-trait.workspace = true
dst = { path = "../dst" }
antithesis-instrumentation = { version = "0.1", optional = true }   # coverage shim; see lib.rs
stable_deref_trait.workspace = true
anyhow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
base64.workspace = true
bitpacking.workspace = true
chrono.workspace = true
time.workspace = true
env_logger = { workspace = true, optional = true }
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
tokenizers = { path = "../tokenizers" }
pgrx.workspace = true
rustix.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_cbor.workspace = true
tantivy.workspace = true
tantivy-common.workspace = true
thiserror.workspace = true
ordered-float.workspace = true
uuid.workspace = true
strum.workspace = true
serde_path_to_error.workspace = true
bincode.workspace = true
rand.workspace = true
proptest = { workspace = true, optional = true }
postcard.workspace = true
regex.workspace = true
tantivy-fst.workspace = true
lazy_static.workspace = true
macros = { path = "../macros" }
half.workspace = true
bytemuck.workspace = true
decimal-bytes.workspace = true
bigdecimal.workspace = true
paste.workspace = true
typetag.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
url.workspace = true
libc.workspace = true
bytes.workspace = true
datafusion.workspace = true
datafusion-proto.workspace = true
datafusion-distributed.workspace = true
futures.workspace = true
async-stream.workspace = true
prost.workspace = true

[dev-dependencies]
common = { path = "../common", default-features = false, features = [
  "pg_test",
] }
storage = { path = "../storage", default-features = false, features = [
  "pg_test",
] }
index_read = { path = "../index_read", default-features = false, features = [
  "pg_test",
] }
index_write = { path = "../index_write", default-features = false, features = [
  "pg_test",
] }
scan = { path = "../scan", default-features = false, features = ["pg_test"] }
planner = { path = "../planner", default-features = false, features = [
  "pg_test",
] }
basescan = { path = "../basescan", default-features = false, features = [
  "pg_test",
] }
joinscan = { path = "../joinscan", default-features = false, features = [
  "pg_test",
] }
pgrx-tests.workspace = true
postgres.workspace = true
rstest.workspace = true
proptest.workspace = true
